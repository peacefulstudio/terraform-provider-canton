name: Bug report
description: Report unexpected provider behaviour against a Canton participant.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out as
        much of the form as you can — reproducible reports get fixed fastest.

        **Security-sensitive bug?** Stop here and follow [SECURITY.md](https://github.com/peacefulstudio/terraform-provider-canton/blob/dev/SECURITY.md)
        instead of opening a public issue.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-paragraph description of the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Minimal HCL config and the commands you ran. Redact secrets.
      placeholder: |
        ```hcl
        provider "canton" {
          participant_url = "https://participant.example.com"
        }

        resource "canton_party" "example" {
          party_id_hint = "example"
        }
        ```

        ```bash
        terraform init
        terraform apply
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the full Terraform error output and any relevant `TF_LOG=DEBUG` lines (with secrets redacted).
    validations:
      required: true

  - type: input
    id: provider-version
    attributes:
      label: Provider version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: terraform-version
    attributes:
      label: Terraform version
      placeholder: "1.9.5"
    validations:
      required: true

  - type: input
    id: canton-version
    attributes:
      label: Canton participant version
      placeholder: "e.g. 3.2.0, or the Canton image tag you're running"
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.1 / Ubuntu 24.04 / Windows 11"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else that might help — workarounds tried, related issues, suspected root cause.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/peacefulstudio/terraform-provider-canton/blob/dev/CODE_OF_CONDUCT.md).
          required: true
