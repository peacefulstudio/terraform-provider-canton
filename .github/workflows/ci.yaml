name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      run_acceptance_tests:
        description: 'Run acceptance tests (requires LocalNet VM)'
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Build
        run: go build ./...

      - name: Test with coverage
        # Build (above) already validates main.go compiles. main.go is just the
        # plugin server entry point and has no tests by design — including it
        # in the coverage profile drags the report to a misleading 0% on the
        # root package, so we scope the coverprofile to ./internal/...
        run: go test -v -race -coverprofile=coverage.out ./internal/...

      - name: Convert coverage to Cobertura
        run: |
          go install github.com/boumenot/gocover-cobertura@v1.4.0
          gocover-cobertura < coverage.out > coverage.xml

      - name: Code Coverage Summary Report
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: 'markdown'
          output: 'both'

      - name: Augment coverage report with cyclomatic complexity
        # gocover-cobertura sets <class complexity="0"/> unconditionally, so
        # CodeCoverageSummary's Complexity column always renders as 0. Run
        # gocyclo, substitute the real average into the coverage table, and
        # append a collapsed details block listing the top-10 production
        # functions with whether each is exercised by tests ("attended").
        # CodeCoverageSummary runs in a Docker container and writes the file
        # as root — chown it back to the runner user before editing.
        run: |
          set -euo pipefail
          sudo chown "$(id -un)" code-coverage-results.md
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          GOCYCLO="$(go env GOPATH)/bin/gocyclo"

          AVG=$("$GOCYCLO" -avg -ignore '_test\.go' internal/ | awk '/^Average:/{print $2}')
          if [ -z "${AVG}" ]; then
            echo "::error::Failed to extract average complexity from gocyclo output"
            exit 1
          fi
          sed -i "s/| 0 |/| ${AVG} |/g; s/| \*\*0\*\* |/| **${AVG}** |/g" code-coverage-results.md
          if ! grep -qF "| ${AVG} |" code-coverage-results.md; then
            echo "::warning::Coverage report format changed — Complexity column not patched. Check CodeCoverageSummary version."
          fi

          go tool cover -func=coverage.out > /tmp/cov-func.txt

          {
            echo
            echo "<details>"
            echo "<summary>Cyclomatic complexity — top 10 production functions (average ${AVG})</summary>"
            echo
            echo "| Complexity | Function | Location | Attended |"
            echo "| ---------: | -------- | -------- | :------- |"
            "$GOCYCLO" -top 10 -ignore '_test\.go' internal/ | while read -r complexity package func location; do
              file_line="${location%:*}"
              if [[ ! "${file_line}" =~ \.go:[0-9]+$ ]]; then
                echo "| ${complexity} | \`${func}\` | \`${location}\` | ? parse |"
                continue
              fi
              if pct=$(grep -F "${file_line}:" /tmp/cov-func.txt | head -1 | awk 'NF{print $NF}') && [ -n "${pct}" ]; then
                case "${pct}" in
                  0.0%) attended="✗ 0.0%" ;;
                  *)    attended="✓ ${pct}" ;;
                esac
              else
                attended="? no-row"
              fi
              echo "| ${complexity} | \`${func}\` | \`${file_line}\` | ${attended} |"
            done
            echo
            echo "</details>"
          } >> code-coverage-results.md

      - name: Add Coverage PR Comment
        # Skip dependabot (it can't write to its own PRs anyway) and PRs from
        # forks (GITHUB_TOKEN is read-only in that context regardless of
        # `pull-requests: write`, so the post would 403). The job summary still
        # gets the report so external contributors see their coverage.
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        if: >-
          github.event_name == 'pull_request'
          && github.actor != 'dependabot[bot]'
          && github.event.pull_request.head.repo.full_name == github.repository
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Write to Job Summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pin to a specific golangci-lint release so an upstream lint addition
          # / breaking change can't fail this repo's CI without a deliberate bump.
          version: v2.12.1

  check-vm:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 2
    environment: LocalNet
    if: ${{ inputs.run_acceptance_tests || vars.LOCALNET_ENABLED == 'true' }}
    outputs:
      reachable: ${{ steps.vm_check.outputs.reachable }}

    steps:
      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.LOCALNET_SSH_KEY }}
          LOCALNET_KNOWN_HOST: ${{ secrets.LOCALNET_KNOWN_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/localnet_key
          chmod 600 ~/.ssh/localnet_key
          printf '%s\n' "$LOCALNET_KNOWN_HOST" >> ~/.ssh/known_hosts

      - name: Check VM reachability
        id: vm_check
        continue-on-error: true
        env:
          LOCALNET_HOST: ${{ secrets.LOCALNET_HOST }}
        run: |
          if ssh -i ~/.ssh/localnet_key \
            -o ConnectTimeout=10 \
            -o BatchMode=yes \
            ubuntu@"$LOCALNET_HOST" echo "reachable"; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notice if unreachable
        if: steps.vm_check.outputs.reachable != 'true'
        run: echo "::notice::LocalNet VM is not reachable — acceptance tests will be skipped"

  acceptance-test:
    needs: check-vm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    environment: LocalNet
    if: needs.check-vm.outputs.reachable == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.LOCALNET_SSH_KEY }}
          LOCALNET_KNOWN_HOST: ${{ secrets.LOCALNET_KNOWN_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/localnet_key
          chmod 600 ~/.ssh/localnet_key
          printf '%s\n' "$LOCALNET_KNOWN_HOST" >> ~/.ssh/known_hosts

      - name: Open SSH tunnel to LocalNet
        env:
          LOCALNET_HOST: ${{ secrets.LOCALNET_HOST }}
        run: |
          ssh -fN \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o ExitOnForwardFailure=yes \
            -L 3901:localhost:3901 \
            -L 8082:localhost:8082 \
            -i ~/.ssh/localnet_key \
            ubuntu@"$LOCALNET_HOST"

          # Verify tunnel is working — poll the Keycloak OIDC endpoint
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8082/realms/AppProvider/.well-known/openid-configuration > /dev/null 2>&1; then
              echo "LocalNet is reachable via tunnel"
              exit 0
            fi
            echo "Waiting for tunnel... ($i/10)"
            sleep 3
          done
          echo "::error::Failed to reach LocalNet through SSH tunnel"
          exit 1

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          CANTON_PARTICIPANT_URL: "localhost:3901"
          CANTON_OAUTH2_TOKEN_URL: "http://localhost:8082/realms/AppProvider/protocol/openid-connect/token"
          CANTON_OAUTH2_CLIENT_ID: ${{ vars.CANTON_OAUTH2_CLIENT_ID }}
          CANTON_OAUTH2_CLIENT_SECRET: ${{ secrets.CANTON_OAUTH2_CLIENT_SECRET }}
          CANTON_OAUTH2_AUDIENCE: ${{ vars.CANTON_OAUTH2_AUDIENCE }}
        run: go test -v ./internal/provider/ -run TestAcc -timeout 120s
