name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Verify tag is on prod branch
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin prod
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/prod; then
            echo "::error::Release tags must be on commits reachable from the prod branch. Merge dev into prod before tagging."
            exit 1
          fi
          echo "Tag ${TAG_SHA} is on prod — proceeding with release."

      - name: Stage release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="release-notes/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Release notes missing at $NOTES. Create release-notes/${TAG}.md before tagging (see release-notes/README.md)."
            exit 1
          fi
          cp "$NOTES" .release-notes.md
          echo "Using $NOTES as release body."

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: "go.mod"

      - name: Check GPG key availability
        id: gpg_check
        env:
          HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        run: echo "available=$HAS_GPG_KEY" >> "$GITHUB_OUTPUT"

      - name: Import GPG key
        if: steps.gpg_check.outputs.available == 'true'
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          version: "~> v2"
          args: release --clean ${{ steps.gpg_check.outputs.available != 'true' && '--skip=sign' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
